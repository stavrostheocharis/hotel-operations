[project]
name = "hotel-season-generator"
version = "0.1.0"
description = "Synthetic season-data generator for a fictional Greek luxury resort (work orders, front-desk log, surveys, reviews, PMS stays) with a hidden answer key for record-linking evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
hotel-season-generator = "generator.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
