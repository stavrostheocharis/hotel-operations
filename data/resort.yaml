# Fictional resort used by the synthetic season-data generator.
# Nothing in this file refers to a real property, company or person.

resort:
  name: "Astraea Bay Resort & Villas"
  short_name: "Astraea Bay"
  region: "Mirabello coast, Crete (fictional)"
  stars: 5
  season_open: 2026-04-01
  season_close: 2026-10-31
  timezone: "Europe/Athens"

# Buildings. Room numbers are unique across the property; the first digit is the floor,
# the remaining two digits identify the room, and each wing owns a contiguous block of
# numbers on each floor. Villas are numbered V01..V20.
buildings:
  - code: A
    name: "Main Building"
    marketing_name: "Main Building"
    greek_name: "Κεντρικό"
    floors: [1, 2, 3]
    rooms_per_floor: 30
    first_room_on_floor: 1          # A: x01..x30
    room_types:
      - {type: "Classic Garden View", view: "garden", share: 0.40}
      - {type: "Superior Sea View", view: "sea", share: 0.35}
      - {type: "Junior Suite", view: "sea", share: 0.25}
  - code: B
    name: "Garden Wing"
    marketing_name: "Garden Wing"
    greek_name: "Κήπος"
    floors: [1, 2, 3]
    rooms_per_floor: 30
    first_room_on_floor: 31         # B: x31..x60
    room_types:
      - {type: "Classic Garden View", view: "garden", share: 0.50}
      - {type: "Family Suite", view: "garden", share: 0.30}
      - {type: "Superior Pool View", view: "pool", share: 0.20}
  - code: C
    name: "Sea Wing"
    marketing_name: "Sea Wing"
    greek_name: "Θάλασσα"
    floors: [1, 2, 3]
    rooms_per_floor: 20
    first_room_on_floor: 61         # C: x61..x80
    room_types:
      - {type: "Superior Sea View", view: "sea", share: 0.55}
      - {type: "Deluxe Sea View Suite", view: "sea", share: 0.30}
      - {type: "Junior Suite", view: "side sea", share: 0.15}
  - code: D
    name: "Cliff Wing"
    marketing_name: "Cliff Wing"
    greek_name: "Βράχος"
    floors: [1, 2]
    rooms_per_floor: 19
    first_room_on_floor: 81         # D: x81..x99
    room_types:
      - {type: "Deluxe Sea View Suite", view: "sea", share: 0.45}
      - {type: "Suite with Private Pool", view: "sea", share: 0.35}
      - {type: "Superior Sea View", view: "sea", share: 0.20}
  - code: V
    name: "Villas"
    marketing_name: "Astraea Villas"
    greek_name: "Βίλες"
    floors: [0]
    villas: 20                      # V01..V20, each with private pool
    room_types:
      - {type: "Two-Bedroom Pool Villa", view: "sea", share: 0.65}
      - {type: "Three-Bedroom Pool Villa", view: "sea", share: 0.35}

facilities:
  - {code: POOL-MAIN, name: "Main Pool", type: pool, area: "central gardens", notes: "lagoon-style, heated in shoulder season"}
  - {code: POOL-INFINITY, name: "Infinity Pool (adults only)", type: pool, area: "Cliff Wing terrace", notes: "heated"}
  - {code: SPA, name: "Thalassa Spa", type: spa, area: "Garden Wing ground floor", notes: "hammam, sauna, 6 treatment rooms"}
  - {code: GYM, name: "Fitness Studio", type: gym, area: "Garden Wing ground floor"}
  - {code: REST-ORIZONTAS, name: "Orizontas Restaurant", type: restaurant, area: "Main Building", notes: "breakfast buffet and themed dinners"}
  - {code: REST-AMMOS, name: "Ammos Beach Taverna", type: restaurant, area: "beach", notes: "lunch and dinner, Cretan"}
  - {code: REST-ELIA, name: "Elia Fine Dining", type: restaurant, area: "Sea Wing roof", notes: "dinner only, reservation required"}
  - {code: BEACHBAR, name: "Kyma Beach Bar", type: bar, area: "beach", notes: "DJ sets in high season"}
  - {code: LOBBY, name: "Lobby & Reception", type: public, area: "Main Building"}
  - {code: KIDS, name: "Kids Club", type: kids, area: "central gardens"}
  - {code: PARKING, name: "Guest Parking", type: outdoor, area: "entrance"}

