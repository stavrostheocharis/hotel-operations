# Target share of rooms occupied at mid-month; interpolated day by day, with a weekly
# arrival ripple (Sat/Sun/Thu charter days) and a little noise on top.
occupancy_curve:
  "2026-04": 0.34
  "2026-05": 0.57
  "2026-06": 0.79
  "2026-07": 0.93
  "2026-08": 0.97
  "2026-09": 0.84
  "2026-10": 0.47

stay_length:
  # nights; weights per bucket, shifted longer in July/August, shorter in April/October
  base: {2: 0.08, 3: 0.14, 4: 0.17, 5: 0.19, 6: 0.14, 7: 0.20, 8: 0.03, 10: 0.03, 14: 0.02}

# Guest language mix (share of stays). The language drives the free-text fields.
languages:
  en: 0.33
  de: 0.24
  fr: 0.12
  it: 0.10
  el: 0.09
  ru: 0.06
  he: 0.06

# Monthly multipliers on the language mix (Italians and Greeks in August, Germans in
# the shoulder months, French in July). Re-normalised per month.
language_seasonality:
  "2026-04": {de: 1.3, en: 1.1, el: 1.4, it: 0.5, fr: 0.7}
  "2026-05": {de: 1.3, en: 1.1, el: 0.8, it: 0.6, fr: 0.8}
  "2026-06": {de: 1.1, en: 1.0, fr: 0.9, it: 0.8}
  "2026-07": {fr: 1.5, it: 1.1, he: 1.3, el: 0.8}
  "2026-08": {it: 2.2, el: 1.8, fr: 1.3, de: 0.6, en: 0.8}
  "2026-09": {de: 1.3, en: 1.1, it: 0.6, el: 0.7}
  "2026-10": {de: 1.5, en: 1.2, el: 1.2, it: 0.4, fr: 0.6, he: 0.6}

# Nationality (ISO 3166-1 alpha-2) given the language, with weights.
nationalities:
  en: {GB: 0.52, US: 0.17, NL: 0.09, IE: 0.05, SE: 0.04, DK: 0.03, NO: 0.03, AU: 0.03, CA: 0.02, PL: 0.02}
  de: {DE: 0.74, AT: 0.16, CH: 0.10}
  fr: {FR: 0.80, BE: 0.13, CH: 0.07}
  it: {IT: 0.97, CH: 0.03}
  el: {GR: 0.90, CY: 0.10}
  ru: {RU: 0.35, IL: 0.20, KZ: 0.15, CY: 0.12, DE: 0.10, LV: 0.08}
  he: {IL: 1.0}

# Signal volumes (per occupied-room-night unless stated) for the unrelated background noise.
noise_rates:
  work_orders_per_occupied_room_night: 0.022   # ~6-7 tickets/day at full house
  preventive_work_orders_per_week: 4
  front_desk_entries_per_occupied_room_night: 0.009
  survey_response_rate: 0.31
  review_rate: 0.075
  survey_comment_rate: 0.58          # share of survey responses with a non-empty comment
  survey_complaint_share: 0.18       # of commented noise surveys, share that mention a one-off problem
  review_complaint_share: 0.30       # of noise reviews, share that mention a one-off problem

# Messiness knobs for the exports
messiness:
  wo_wrong_category_rate: 0.22
  wo_other_category_rate: 0.14
  wo_empty_closure_rate: 0.18
  wo_trivial_closure_rate: 0.14      # "done", "ok", "έγινε"
  wo_missing_reopened_rate: 0.45
  wo_location_typo_rate: 0.025       # digit swaps in noise work-order locations only
  wo_duplicate_rate: 0.03            # same problem logged twice (two departments)
  fd_agent_note_rate: 0.55           # share of front-desk rows that carry an English paraphrase
  fd_missing_room_rate: 0.06         # complaint about a facility logged without a room
  fd_empty_resolution_rate: 0.30
  review_room_number_rate: 0.03      # reviews that mention the room number
  review_wing_mention_rate: 0.35
