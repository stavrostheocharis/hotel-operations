  - {id: B-CHILLER, building: B, type: chiller, name: "Garden Wing chiller", location_text: "Bldg B roof", serves: "all rooms in B, spa, gym", installed: 2016}
  - {id: B-PUMP, building: B, type: water_pump, name: "Garden Wing booster pump set", location_text: "Bldg B plant room", serves: "all rooms in B, spa", installed: 2016}
  - {id: B-LIFT-1, building: B, type: elevator, name: "Garden Wing lift", location_text: "Bldg B core", serves: "floors 0-3 B", installed: 2016}
  - {id: C-BOILER, building: C, type: boiler, name: "Sea Wing hot-water boiler + circulation pumps", location_text: "Bldg C boiler room (ground floor, north side)", serves: "all rooms in C, Elia kitchen", installed: 2011}
  - {id: C-CHILLER, building: C, type: chiller, name: "Sea Wing chiller", location_text: "Bldg C roof", serves: "all rooms in C, Elia", installed: 2011}
  - {id: C-PUMP, building: C, type: water_pump, name: "Sea Wing booster pump set", location_text: "Bldg C boiler room", serves: "all rooms in C", installed: 2020}
  - {id: C-LIFT-1, building: C, type: elevator, name: "Sea Wing lift", location_text: "Bldg C core", serves: "floors 0-3 C and Elia roof", installed: 2011}
  - {id: D-BOILER, building: D, type: boiler, name: "Cliff Wing hot-water boiler (solar-assisted)", location_text: "Bldg D plant room", serves: "all rooms in D", installed: 2018}
  - {id: D-CHILLER, building: D, type: chiller, name: "Cliff Wing chiller", location_text: "Bldg D roof terrace, behind the infinity pool", serves: "all rooms in D", installed: 2018}
  - {id: D-PUMP, building: D, type: water_pump, name: "Cliff Wing booster pump set", location_text: "Bldg D plant room", serves: "all rooms in D, infinity pool showers", installed: 2018}
  - {id: D-LIFT-1, building: D, type: elevator, name: "Cliff Wing lift", location_text: "Bldg D core", serves: "floors 0-2 D and infinity pool terrace", installed: 2018}
  - {id: POOLMAIN-FILTER, building: null, type: pool_plant, name: "Main pool filtration + dosing", location_text: "Main pool plant room", serves: "POOL-MAIN", installed: 2015}
  - {id: POOLINF-HEATPUMP, building: null, type: heat_pump, name: "Infinity pool heat pump", location_text: "Bldg D roof terrace", serves: "POOL-INFINITY", installed: 2018}
