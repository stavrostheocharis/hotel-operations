  - {id: A-LIFT-1, building: A, type: elevator, name: "Main Building lift 1 (lobby side)", location_text: "Bldg A lobby", serves: "floors 0-3 A", installed: 2014}
  - {id: A-LIFT-2, building: A, type: elevator, name: "Main Building lift 2 (garden side)", location_text: "Bldg A garden entrance", serves: "floors 0-3 A", installed: 2014}
