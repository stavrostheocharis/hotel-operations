  - {id: BEACHBAR-COLD, building: null, type: refrigeration, name: "Beach bar cold room + ice machine", location_text: "Kyma beach bar back-of-house", serves: "BEACHBAR", installed: 2017}
  - {id: BEACHBAR-PA, building: null, type: audio, name: "Beach bar sound system", location_text: "Kyma beach bar", serves: "BEACHBAR", installed: 2022}
  - {id: ELIA-AC, building: C, type: split_ac, name: "Elia dining room split units (x4)", location_text: "Sea Wing roof, Elia", serves: "REST-ELIA", installed: 2011}
  - {id: AMMOS-GREASETRAP, building: null, type: drainage, name: "Ammos kitchen grease trap", location_text: "behind Ammos taverna", serves: "REST-AMMOS", installed: 2013}
